name: Run Test

on:
  workflow_dispatch:
jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Link SQLite Cache
        uses: actions/cache@v4
        with:
          path: stk_cache.sqlite
          key: stock-cache-db-${{ github.run_id}}
          restore-keys: |
            stock-cache-db-

      - name: Run Script
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
          SEND_TO: ${{ secrets.SEND_TO }}
          STK_API_KEY: ${{ secrets.STK_API_KEY }}
          NWS_API_KEY: ${{ secrets.NWS_API_KEY }}

        run: python main.py


